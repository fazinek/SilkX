<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SilkX — Aurora Perfumes</title>

<meta name="description"
content="SilkX by Aurora Perfumes — Sweet. Smooth. Addictive.">

<style>
:root{
  --maroon:#4b002c;
  --deep:#240014;
  --gold:#d6b36a;
  --cream:#fffaf5;
  --soft:#f7edf1;
  --text:#26161e;
  --muted:#75656d;
  --white:#ffffff;
  --border:#eadde3;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--cream);
  color:var(--text);
}

a{
  text-decoration:none;
  color:inherit;
}

.container{
  width:min(1080px,92%);
  margin:auto;
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(255,250,245,.95);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}

.nav{
  height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  height:45px;
  width:auto;
}

.nav-links{
  display:flex;
  gap:22px;
  font-size:14px;
}

.nav-links a:hover{
  color:var(--maroon);
}

/* BUTTONS */

.btn{
  border:none;
  border-radius:12px;
  padding:14px 20px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-1px);
}

.primary{
  background:var(--maroon);
  color:white;
}

.gold{
  background:var(--gold);
  color:#24150a;
}

.outline{
  background:white;
  color:var(--maroon);
  border:1px solid var(--maroon);
}

/* HERO */

.hero{
  padding:70px 0;
  background:linear-gradient(135deg,#fffaf5,#f5e7ee);
}

.hero-grid{
  display:grid;
  grid-template-columns:1.1fr .9fr;
  gap:50px;
  align-items:center;
}

.eyebrow{
  color:var(--maroon);
  font-weight:800;
  letter-spacing:2px;
  font-size:12px;
}

h1{
  font-family:Georgia,serif;
  font-size:clamp(55px,8vw,85px);
  color:var(--maroon);
  margin:15px 0;
}

.hero h2{
  font-size:23px;
  margin-bottom:15px;
}

.hero p{
  color:var(--muted);
  font-size:17px;
  line-height:1.7;
  max-width:560px;
}

.actions{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-top:28px;
}

  display:flex;
  align-items:center;
  justify-content:center;
  position:relative
